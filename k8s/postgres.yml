apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: intranet
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: data
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: intranetdb
            - name: POSTGRES_USER
              value: intranet
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: intranet-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "intranet", "-d", "intranetdb"]
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: intranet
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
