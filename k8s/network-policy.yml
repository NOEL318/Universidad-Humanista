# Solo el front entra al gateway, y solo el backend llega a los servicios y a la bd
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-only
  namespace: intranet
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [frontend, api-gateway]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-frontend
  namespace: intranet
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: web
