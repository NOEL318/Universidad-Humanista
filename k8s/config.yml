apiVersion: v1
kind: ConfigMap
metadata:
  name: intranet-config
  namespace: intranet
data:
  PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: intranetdb
  DB_USER: intranet
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  AUTH_URL: http://auth:8080
  USER_URL: http://user:8080
  MEMBER_URL: http://member:8080
  ACADEMIC_URL: http://academic:8080
  # cambiar a "true" cuando el servidor tenga https
  COOKIE_SECURE: "false"
