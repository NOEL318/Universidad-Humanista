spring:
  application:
    name: user
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intranetdb}
    username: ${DB_USER:intranet}
    password: ${DB_PASSWORD:intranet}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 10m
server:
  port: ${PORT:8081}
management:
  graphite:
    metrics:
      export:
        enabled: false
admin:
  email: ${ADMIN_EMAIL:admin@intranet.local}
  password: ${ADMIN_PASSWORD:}
