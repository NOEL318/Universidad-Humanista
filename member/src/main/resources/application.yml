spring:
  application:
    name: member
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intranetdb}
    username: ${DB_USER:intranet}
    password: ${DB_PASSWORD:intranet}
server:
  port: ${PORT:8082}
management:
  graphite:
    metrics:
      export:
        enabled: false
services:
  user: ${USER_URL:http://localhost:8081}
