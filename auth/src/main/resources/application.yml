spring:
  application:
    name: auth
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intranetdb}
    username: ${DB_USER:intranet}
    password: ${DB_PASSWORD:intranet}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${PORT:8084}
auth:
  session-hours: 8
  max-attempts: 5
  lock-minutes: 15
  cookie-secure: ${COOKIE_SECURE:true}
